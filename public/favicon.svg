<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#003893"/>
      <stop offset="50%" stop-color="#00A300"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#003893" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00A300" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  <!-- Shield / badge background -->
  <path d="M256 32L96 128v128c0 128 64 192 160 224 96-32 160-96 160-224V128L256 32z" fill="url(#shieldGrad)" stroke="url(#logoGrad)" stroke-width="12"/>
  <!-- ST letters monogram -->
  <text x="256" y="200" text-anchor="middle" dominant-baseline="central" font-family="system-ui,-apple-system,sans-serif" font-weight="800" font-size="160" fill="url(#logoGrad)">ST</text>
  <!-- Tax underline -->
  <rect x="156" y="250" width="200" height="6" rx="3" fill="#FFD700"/>
  <!-- SmartTax text -->
  <text x="256" y="300" text-anchor="middle" dominant-baseline="central" font-family="system-ui,-apple-system,sans-serif" font-weight="600" font-size="36" fill="#003893">SmartTax</text>
  <!-- Rwanda small text -->
  <text x="256" y="334" text-anchor="middle" dominant-baseline="central" font-family="system-ui,-apple-system,sans-serif" font-weight="400" font-size="18" fill="#00A300">Rwanda</text>
  <!-- Decorative dots (flag colors) -->
  <circle cx="160" cy="390" r="8" fill="#003893"/>
  <circle cx="200" cy="390" r="8" fill="#FFD700"/>
  <circle cx="240" cy="390" r="8" fill="#00A300"/>
  <circle cx="280" cy="390" r="8" fill="#003893"/>
  <circle cx="320" cy="390" r="8" fill="#FFD700"/>
  <circle cx="360" cy="390" r="8" fill="#00A300"/>
</svg>
